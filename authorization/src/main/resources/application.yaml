spring:
  application:
    name: authorization
  datasource:
    url: jdbc:postgresql://localhost:5432/authorizationdb
    username: authorizer
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  # session:
  #   # store-type: jdbc
  #   timeout: 60m
  #   jdbc:
  #     initialize-schema: always
  mail:
    host: localhost
    port: 587
    username: authorizer
    password: password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

bootstrap:
  superuser:
    username: superuser
    password: password
    first-name: Super
    last-name: User

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
   level:
      org:
         springframework:
            security: debug